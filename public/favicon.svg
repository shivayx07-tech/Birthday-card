<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff7eb3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9a3c" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#sparkle-glow)" />
  <!-- Main 4-pointed Star -->
  <path d="M32 4 C33 22 42 31 60 32 C42 33 33 42 32 60 C31 42 22 33 4 32 C22 31 31 22 32 4 Z" fill="url(#star-grad)" />
  <!-- Mini sparkle dots -->
  <circle cx="16" cy="16" r="3" fill="#fff" opacity="0.9" />
  <circle cx="48" cy="16" r="2.5" fill="#ffd700" opacity="0.9" />
  <circle cx="48" cy="48" r="3" fill="#fff" opacity="0.9" />
  <circle cx="16" cy="48" r="2" fill="#ffd700" opacity="0.8" />
  <!-- Center twinkle -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" />
</svg>
